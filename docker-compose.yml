services:
  postgres:
    image: postgres:16-alpine
    container_name: cobrait-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cobrait_admin
      POSTGRES_USER: cobrait
      POSTGRES_PASSWORD: cobrait123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
