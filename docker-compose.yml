services:
  postgres:
    image: postgres:16-alpine
    container_name: cobrait-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cobrait_admin}
      POSTGRES_USER: ${POSTGRES_USER:-cobrait}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cobrait123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cobrait} -d ${POSTGRES_DB:-cobrait_admin}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cobrait-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-cobrait}:${POSTGRES_PASSWORD:-cobrait123}@postgres:5432/${POSTGRES_DB:-cobrait_admin}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cobrait_admin_session}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_MAX_AGE_HOURS: ${SESSION_MAX_AGE_HOURS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cobrait.pt}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_NAME: ${ADMIN_NAME:-COBRAIT Admin}
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: cobrait-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5500}:80"

volumes:
  postgres_data:
