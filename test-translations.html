<!DOCTYPE html>
<!-- sync: github-desktop-update -->
<html lang=\"pt-PT\">
<head>
    <meta charset=\"UTF-8\">
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
    <title>Teste de Tradução - COBRA IT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Inter, sans-serif; background: #f8f9fa; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { margin: 30px 0 20px 0; color: #4f46e5; }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 20px 0; }
        .test-card { background: white; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; }
        .test-card h3 { color: #1f2937; margin: 0 0 10px 0; }
        .test-card p { color: #6b7280; margin: 5px 0; font-size: 14px; }
        .lang-selector { background: white; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .lang-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .lang-btn { padding: 8px 16px; border: 1px solid #e5e7eb; border-radius: 4px; cursor: pointer; background: white; transition: all 0.3s; }
        .lang-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; }
        .lang-btn:hover { border-color: #4f46e5; }
        .status { padding: 15px; border-radius: 4px; margin: 20px 0; }
        .status.success { background: #d1fae5; color: #065f46; }
        .status.warning { background: #fef3c7; color: #92400e; }
        .test-element { padding: 10px; background: #f3f4f6; margin: 5px 0; border-radius: 4px; font-family: monospace; font-size: 12px; }
    </style>
    <link rel="stylesheet" href="global-enhancements.css">
</head>
<body>
    <div class=\"container\">
        <h1>🧪 Teste de Sistema de Tradução - COBRA IT</h1>
        
        <div class=\"lang-selector\">
            <h3 style=\"margin-bottom: 15px;\">Selecionar Idioma:</h3>
            <div class=\"lang-buttons\">
                <button class=\"lang-btn active\" onclick=\"testLanguage('pt')\">🇵🇹 Português</button>
                <button class=\"lang-btn\" onclick=\"testLanguage('en')\">🇬🇧 English</button>
                <button class=\"lang-btn\" onclick=\"testLanguage('es')\">🇪🇸 Español</button>
                <button class=\"lang-btn\" onclick=\"testLanguage('fr')\">🇫🇷 Français</button>
                <button class=\"lang-btn\" onclick=\"testLanguage('de')\">🇩🇪 Deutsch</button>
                <button class=\"lang-btn\" onclick=\"testLanguage('ru')\">🇷🇺 Русский</button>
                <button class=\"lang-btn\" onclick=\"testLanguage('nl')\">🇳🇱 Nederlands</button>
                <button class=\"lang-btn\" onclick=\"testLanguage('ja')\">🇯🇵 日本語</button>
                <button class=\"lang-btn\" onclick=\"testLanguage('zh')\">🇨🇳 中文</button>
            </div>
        </div>

        <div id=\"status\"></div>

        <h2 style=\"margin-top: 30px;\">Elementos Testados:</h2>
        <div id=\"results\" class=\"test-grid\"></div>
    </div>

    <script>
        // Test elements with translations
        const testElements = [
            { text: \"Work\", pt: \"Work\", en: \"Work\", es: \"Work\", fr: \"Work\", de: \"Work\", ru: \"Work\", nl: \"Work\", ja: \"Work\", zh: \"Work\" },
            { text: \"Services\", pt: \"Serviços\", en: \"Services\", es: \"Servicios\", fr: \"Services\", de: \"Dienstleistungen\", ru: \"Услуги\", nl: \"Services\", ja: \"サービス\", zh: \"服务\" },
            { text: \"Pricing\", pt: \"Preços\", en: \"Pricing\", es: \"Precios\", fr: \"Tarification\", de: \"Preisgestaltung\", ru: \"Цены\", nl: \"Prijzen\", ja: \"価格\", zh: \"价格\" },
            { text: \"About Us\", pt: \"Sobre nós\", en: \"About Us\", es: \"Sobre nosotros\", fr: \"À propos de nous\", de: \"Über uns\", ru: \"О нас\", nl: \"Over ons\", ja: \"私たちについて\", zh: \"关于我们\" },
            { text: \"Careers\", pt: \"Carreiras\", en: \"Careers\", es: \"Carreras\", fr: \"Carrières\", de: \"Karrieren\", ru: \"Карьеры\", nl: \"Carrières\", ja: \"キャリア\", zh: \"业务\" },
            { text: \"Book a call\", pt: \"Agendar uma chamada\", en: \"Book a call\", es: \"Reservar una llamada\", fr: \"Programmer un appel\", de: \"Einen Anruf buchen\", ru: \"Запланировать звонок\", nl: \"Een gesprek inplannen\", ja: \"コールをスケジュール\", zh: \"安排通话\" },
            { text: \"See services\", pt: \"Ver serviços\", en: \"See services\", es: \"Ver servicios\", fr: \"Voir les services\", de: \"Services anzeigen\", ru: \"Посмотреть услуги\", nl: \"Services zien\", ja: \"サービスを表示\", zh: \"查看服务\" },
        ];

        function testLanguage(lang) {
            const results = document.getElementById('results');
            const langButtons = document.querySelectorAll('.lang-btn');
            
            // Update button states
            langButtons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Clear results
            results.innerHTML = '';
            
            // Test each element
            testElements.forEach(element => {
                const card = document.createElement('div');
                card.className = 'test-card';
                
                const translation = element[lang] || element.pt;
                const isComplete = element[lang] !== undefined;
                
                card.innerHTML = `
                    <h3>${element.text}</h3>
                    <p><strong>Current (${lang}):</strong> ${translation}</p>
                    <p style=\"color: ${isComplete ? '#10b981' : '#ef4444'}\">
                        ${isComplete ? '✓ Tradução presente' : '✗ Tradução faltante'}
                    </p>
                `;
                
                results.appendChild(card);
            });

            // Check file accessibility
            checkFileAccess();
        }

        function checkFileAccess() {
            const status = document.getElementById('status');
            const files = [
                'index.html',
                'about-us.html',
                'book-a-call.html',
                'careers.html',
                'pricing.html',
                'project.html',
                'tech.html',
                'Serviços.html',
                'servicos/product-scope.html',
                'servicos/mvp-builder.html',
                'servicos/ux-ui.html',
                'servicos/custom-software.html',
                'servicos/dedicated-teams.html'
            ];

            let message = '<div class=\"status success\"><strong>✓ Sistema de Tradução Pronto</strong><p>';
            message += 'Todos os ' + (files.length + 1) + ' arquivos foram configurados.<br>';
            message += 'Idiomas suportados: PT, EN, ES, FR, DE, RU, NL, JA, ZH</p></div>';
            
            status.innerHTML = message;
        }

        // Initialize
        testLanguage('pt');
    </script>
</body>
</html>"
